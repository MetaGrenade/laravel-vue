name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SQLite: the fast path, also used for local development. Also audits dependencies.
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (SQLite)
        run: php artisan test

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

  # MySQL 8: a supported production database.
  ci-mysql:
    name: ci-mysql (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: metaforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: metaforge
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (MySQL 8)
        run: php artisan test

  # PostgreSQL 16: a supported production database.
  ci-pgsql:
    name: ci-pgsql (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metaforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: metaforge
      DB_USERNAME: postgres
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (PostgreSQL 16)
        run: php artisan test
