# A site on one machine: the web server, the queue worker, the scheduler, MySQL and Redis. docs/docker.md says how to use it.
#
#   cp .env.example .env                  # then set what docs/docker.md lists
#   docker compose -f compose.production.yaml build
#   docker compose -f compose.production.yaml up -d
#
# The settings come from .env next to this file. Compose reads it for the ${...} below and hands all of it to the containers, so every
# setting of docs/configuration.md can be set there. The few settings that depend on how the containers are wired together (the
# database host, Redis, where logs go) are set here and win over .env.
#
# This is not the file for development: that is compose.yaml, which only runs the services the site uses while the site runs on your
# machine. The two have different project names, so their containers and volumes never meet.

name: metaforger-site

x-site: &site
  image: metaforger:latest
  restart: unless-stopped
  # A small init process as PID 1, which passes the stop signal on. PHP as PID 1 gets no default reaction to it, and the scheduler
  # handles none of its own, so without this `stop` waits ten seconds and then kills it.
  init: true
  env_file: ${ENV_FILE:-.env}
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: '3306'
    DB_DATABASE: ${DB_DATABASE:-metaforger}
    DB_USERNAME: ${DB_USERNAME:-metaforger}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_HOST: redis
    REDIS_PASSWORD: 'null'
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    # Containers log to the output, where `docker compose logs` and a log collector read it.
    LOG_CHANNEL: stack
    LOG_STACK: stderr
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # The web server. Answers plain HTTP on 80 by default; with SERVER_NAME set to a domain name it gets a certificate and answers on 443.
  app:
    <<: *site
    build:
      context: .
      args:
        # Built into the JavaScript (docs/configuration.md, "Built into the JavaScript"): a change to one needs `build` again.
        VITE_APP_NAME: ${APP_NAME:-MetaForger}
        VITE_BROADCAST_DRIVER: ${BROADCAST_CONNECTION:-pusher}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
        VITE_PUSHER_HOST: ${PUSHER_HOST:-}
        VITE_PUSHER_PORT: ${PUSHER_PORT:-}
        VITE_PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
        VITE_PUSHER_FORCE_TLS: ${PUSHER_FORCE_TLS:-}
    ports:
      - '${APP_HTTP_PORT:-80}:80'
      - '${APP_HTTPS_PORT:-443}:443'
      - '${APP_HTTPS_PORT:-443}:443/udp'
    volumes:
      - storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@file_get_contents("http://127.0.0.1:8081/up") === false ? 1 : 0);']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Sends the emails that are queued (all but the two Laravel sends at once, to verify an address and to reset a password) and runs the
  # jobs the shop and the scheduler start (docs/redis.md, "The queue"). Raise the number of workers with
  # `docker compose up -d --scale worker=2`.
  worker:
    <<: *site
    command: ['php', 'artisan', 'metaforger:queue', 'work', 'redis', '--sleep=3', '--tries=3', '--max-time=3600']
    stop_grace_period: 90s
    volumes:
      - storage:/app/storage

  # Puts the timed jobs on the queue, once a minute. Run exactly one: the scheduled jobs are not locked against each other.
  scheduler:
    <<: *site
    command: ['php', 'artisan', 'schedule:work']
    volumes:
      - storage:/app/storage

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-metaforger}
      MYSQL_USER: ${DB_USERNAME:-metaforger}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 12

  # The cache, the queue and the sessions (docs/redis.md). It is reachable from the other containers only; it has no password and no
  # published port. The append-only file keeps the queue and the sessions across a restart, and noeviction makes a full Redis refuse a
  # write instead of dropping a queued job or a session to make room.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Uploads, private files and logs. Back this up with the database.
  storage:
  # The certificates Caddy gets, and its configuration. Losing them makes Caddy ask for new ones, which Let's Encrypt limits.
  caddy-data:
  caddy-config:
  mysql-data:
  redis-data:
