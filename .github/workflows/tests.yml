name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SQLite: the fast path, also used for local development. Also audits dependencies.
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (SQLite)
        run: php artisan test

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

  # MySQL 8: a supported production database.
  ci-mysql:
    name: ci-mysql (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: metaforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      EXPECTED_DB_DRIVER: mysql
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: metaforge
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (MySQL 8)
        run: php artisan test

  # PostgreSQL 16: a supported production database.
  ci-pgsql:
    name: ci-pgsql (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metaforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      EXPECTED_DB_DRIVER: pgsql
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: metaforge
      DB_USERNAME: postgres
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run tests (PostgreSQL 16)
        run: php artisan test

  # axe on the public pages. The M7 Playwright smoke suite is a separate item.
  a11y:
    name: a11y (axe)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the accessibility audit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/a11y.sqlite
          DB_URL: ''
          APP_URL: http://127.0.0.1:8000
          A11Y_PREPARE: '1'
        run: npx playwright test --config=tests/a11y/playwright.config.ts

  # A real Meilisearch (the version compose.yaml runs): what the search tests with a fake engine cannot show. How it ranks, what a typo
  # still finds, what leaves the index, the health check against what is really there, and the key recipe in docs/search-index.md.
  # The tests are in tests/Live/Meilisearch, which `php artisan test` does not run, and skip themselves unless MEILISEARCH_LIVE_HOST is set.
  search:
    name: search (Meilisearch 1.12)
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          # Not a secret: a throwaway engine that lives for this job.
          MEILI_MASTER_KEY: meilisearch-ci-not-a-secret
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl --fail http://localhost:7700/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      MEILISEARCH_LIVE_HOST: http://127.0.0.1:7700
      MEILISEARCH_LIVE_KEY: meilisearch-ci-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run the Meilisearch tests
        run: php artisan test tests/Live/Meilisearch

  # The cache, the queue and the sessions on a real Redis, the way a production site is set up (docs/redis.md): where each one lives,
  # what clearing the cache leaves alone, when a queued job is let in and that a worker runs one.
  # The tests are in tests/Live/Redis, which `php artisan test` does not run, and skip themselves unless REDIS_LIVE_HOST is set.
  redis:
    name: redis (Redis 7)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      REDIS_LIVE_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Run the Redis tests
        run: php artisan test tests/Live/Redis

  # What the built front end weighs, in gzipped bytes: what every page loads, what a page adds to that, and the largest script.
  # The numbers are in scripts/bundle-budget.json; docs/bundle-budget.md says how to read a failure and when to raise one.
  bundle:
    name: bundle (size budget)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the application
        uses: ./.github/actions/setup-app

      - name: Test the size check
        run: npm run bundle:test

      - name: Check the size of the build
        run: npm run bundle:check
