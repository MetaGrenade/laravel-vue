name: Set up the application
description: Install PHP and Node dependencies, create an environment file and build the front-end assets

inputs:
  php-version:
    description: PHP version
    default: '8.4'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, zip, gd
        tools: composer:v2
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install PHP dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    # The build downloads the Inter font from Bunny and keeps it in this
    # directory; with it restored the build makes no request at all, so a slow
    # or unreachable font host cannot fail a job. It is restored after
    # `npm ci`, which deletes node_modules, and keyed on what decides the
    # download (the fonts in vite.config.ts and the plugin that fetches them).
    - name: Cache downloaded fonts
      uses: actions/cache@v6
      with:
        path: node_modules/.cache/laravel-vite-plugin/fonts
        key: vite-fonts-${{ hashFiles('vite.config.ts', 'package-lock.json') }}

    - name: Prepare environment
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Build assets
      shell: bash
      run: npm run build
