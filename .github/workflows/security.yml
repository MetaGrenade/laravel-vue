name: security

on:
  push:
    branches:
      - develop
      - main
      - chore/m0-foundations # TEMPORARY: remove before merging M0
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Weekly, so new advisories are noticed even when no code changes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Audit Composer dependencies
        # --locked reads composer.lock, so no `composer install` is needed.
        run: composer audit --locked

      - name: Audit npm dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
