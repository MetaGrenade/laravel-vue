version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns:
          - 'laravel/*'
          - 'inertiajs/*'
      symfony:
        patterns:
          - 'symfony/*'
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns:
          - 'vue*'
          - '@vue/*'
          - '@vitejs/*'
          - '@inertiajs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
    ignore:
      # laravel-vite-plugin declares support for fontaine ^0.8 only. A newer major makes
      # `npm install` fail with ERESOLVE (npm 10), so wait until the plugin widens its range.
      - dependency-name: fontaine
        update-types: ['version-update:semver-major']
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
