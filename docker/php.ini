; What the image sets on top of PHP's production settings (docs/docker.md). The numbers for OPcache are the checklist in
; docs/performance.md. The image never changes after it is built, so PHP does not have to look at a file again.
expose_php = Off
memory_limit = 256M

; At least COMMERCE_DOWNLOAD_MAX_KB (100 MB by default), or PHP refuses the upload before the site sees it.
upload_max_filesize = 110M
post_max_size = 112M

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
