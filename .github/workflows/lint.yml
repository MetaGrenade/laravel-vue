name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Check PHP code style (Pint)
        run: vendor/bin/pint --test

      - name: Check frontend formatting (Prettier)
        run: npm run format:check

      - name: Lint frontend (ESLint)
        run: npm run lint:check

      - name: Type-check frontend (vue-tsc)
        run: npm run types:check

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Check translation files
        run: php artisan lang:check
