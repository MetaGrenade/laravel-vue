name: security

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Weekly, so new advisories are noticed, and every commit on the branch is read for a secret again.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.24.3
        run: |
          set -euo pipefail
          version=8.24.3
          asset="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --retry 4 --retry-max-time 120 \
            --output "$asset" "${url}/${asset}"
          curl --fail --silent --show-error --location --retry 4 --retry-max-time 120 \
            --output checksums.txt "${url}/gitleaks_${version}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum --check -
          tar --extract --gzip --file "$asset" gitleaks
          sudo install --mode 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit on this branch
        # HEAD, not every ref the checkout fetched. --full-history keeps a commit that a merge would otherwise hide.
        run: gitleaks detect --source . --redact --exit-code 1 --log-opts="--full-history HEAD"

      - name: The scanner must refuse a key
        run: |
          set -euo pipefail
          dir=$(mktemp --directory)
          # Built from character codes so this file does not itself contain a key.
          # The characters vary: a run of one letter sits under the entropy bar and the scanner skips it.
          key=$(printf '\101\113\111\101\062\063\064\065\066\067\070\071\102\103\104\105\106\107\110\112')
          printf '%s\n' "$key" > "$dir/leak.txt"
          set +e
          gitleaks detect --source "$dir" --no-git --redact --exit-code 1
          code=$?
          set -e
          rm -rf "$dir"
          if [ "$code" -eq 0 ]; then
            echo "The secrets scan accepted a key."
            exit 1
          fi

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Audit Composer dependencies
        # --locked reads composer.lock, so no `composer install` is needed.
        run: composer audit --locked

      - name: Audit npm dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
